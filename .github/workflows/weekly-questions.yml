# 2000問を超えた後: 毎週月曜 4:00 JST に200問を追加
name: Weekly Question Generation (after 2000)

on:
  schedule:
    - cron: '0 19 * * 0'   # 月曜 19:00 UTC = 月曜 4:00 JST (翌日)
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Run pipeline (weekly: add 200 if count >= 2000)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODE: weekly
        run: npm run pipeline
